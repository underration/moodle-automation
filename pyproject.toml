[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moodle-automation"
version = "0.1.0"
description = "Moodle assignments and course materials to reviewable drafts via Codex OAuth"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
  "playwright>=1.50,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "jsonschema>=4.23,<5",
  "rich>=13.9,<15",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
moodle-auto = "moodle_automation.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

